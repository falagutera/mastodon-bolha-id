# Builds the image and publishes it to the images group (registry.gutocarvalho.net/images/id).
# Runs on the bolha dind runners (bravo-open-*, untagged jobs).
# The version is in the VERSION file. Tags: X.Y.Z-BUILD (immutable, pin this one in k8s), X.Y.Z and latest.
include:
  - project: 'open/gcn/ci-templates'
    file: '/security.yml'
    ref: main
stages: [security, test, build]

test:
  stage: test
  image: golang:1.26-alpine
  services:
    - name: postgres:17-alpine
      alias: postgres
    - name: redis:7.4-alpine
      alias: redis
  variables:
    CGO_ENABLED: "0"
    POSTGRES_PASSWORD: admin
    PGPASSWORD: admin
    ID_TEST_DB_HOST: postgres
    ID_TEST_REDIS: "redis:6379"
  before_script:
    - apk add --no-cache postgresql17-client
    - until pg_isready -h postgres -U postgres; do sleep 1; done
    - psql -h postgres -U postgres -c "CREATE ROLE id LOGIN PASSWORD 'id'" -c "CREATE DATABASE id_test"
    - psql -h postgres -U postgres -d id_test -v ON_ERROR_STOP=1 -f schema.sql
  script:
    - go vet ./...
    - test -z "$(gofmt -l .)"
    - go test -p 1 ./...
    - go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
    - "$(go env GOPATH)/bin/govulncheck ./..."

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$IMAGES_REGISTRY_PASSWORD" | docker login -u "$IMAGES_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - V="$(cat VERSION)"
    - docker build --pull -q --build-arg "BUILD=$CI_PIPELINE_ID" -t "registry.gutocarvalho.net/images/id:$V-$CI_PIPELINE_ID" .
    - for t in "$V" latest; do docker tag "registry.gutocarvalho.net/images/id:$V-$CI_PIPELINE_ID" "registry.gutocarvalho.net/images/id:$t"; done
    - for t in "$V-$CI_PIPELINE_ID" "$V" latest; do docker push -q "registry.gutocarvalho.net/images/id:$t"; done
    - echo "published registry.gutocarvalho.net/images/id:$V-$CI_PIPELINE_ID"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
