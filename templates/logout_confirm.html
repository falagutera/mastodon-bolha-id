{{template "head" .}}
<h1>{{.T.logout_confirm_title}}</h1>
<p>{{.T.logout_confirm}}</p>
<form method="post" action="/logout" class="consent">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  {{if .ClientID}}<input type="hidden" name="client_id" value="{{.ClientID}}">{{end}}
  {{if .LogoutTarget}}<input type="hidden" name="post_logout_redirect_uri" value="{{.LogoutTarget}}">{{end}}
  {{if .State}}<input type="hidden" name="state" value="{{.State}}">{{end}}
  {{if .UILocales}}<input type="hidden" name="ui_locales" value="{{.UILocales}}">{{end}}
  <button type="submit">{{.T.logout}}</button>
</form>
<p><a href="/">{{.T.home}}</a></p>
{{template "foot" .}}
